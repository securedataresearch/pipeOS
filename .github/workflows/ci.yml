name: ci

# pipeOS has had no CI. The scripts in this repo are the ones that decide
# whether a box boots, and until now nothing ran them except a person on a
# box — and no box in the fleet can execute them from inside its agent
# sandbox. This runs the card gate on every push, which is the difference
# between "the generator should be byte-stable" and "it is".

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck the shell surface
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Globs, not a file list. The three files named here before were the
          # card tooling; config.sh and the numbered build scripts — the ones
          # that decide whether a stick boots — were never linted, so a green
          # tick on a PR touching them said nothing about the diff. (#98)
          #
          # No -s flag: every file's own shebang picks its dialect. scripts/ is
          # a mix (nine `#!/usr/bin/env bash`, three `#!/bin/sh`) and forcing
          # `-s sh` on the bash half would invent SC3xxx noise about POSIX
          # features those files are entitled to use. The three files linted
          # before are all `#!/bin/sh`, so dropping `-s sh` changes nothing for
          # them. config.sh has no shebang — it is sourced, never executed —
          # and carries a `# shellcheck shell=bash` directive instead.
          #
          # A non-shell file dropped into overlay/usr/local/bin/ will red this
          # step with SC1008 rather than silently falling out of coverage. That
          # is the intended behaviour: exclude it here on purpose, in writing.
          #
          # -S error: fail on things that are wrong, print things that are
          # merely unidiomatic. A style-red CI gets disabled within a week.
          shellcheck -S error config.sh scripts/*.sh overlay/usr/local/bin/*
          shellcheck config.sh scripts/*.sh overlay/usr/local/bin/* || true

      # pipeOS#97. The deploy tool writes /etc and then persists — no box can
      # run it from inside its sandbox, and the operator who can is exactly
      # the person who should not be finding its bugs by hand on a live box.
      # So the probe deploys real commits into a throwaway root, and the
      # control run mutates the shipped script eleven ways and asserts WHICH
      # rows go red: a probe that cannot fail is not evidence.
      - name: deploy-overlay behaves, and its probe can see it misbehave
        run: |
          python3 scripts/check-deploy-overlay.py
          python3 scripts/check-deploy-overlay-controls.py

      # The deploy verb is run by hand; these two run on every box at every
      # boot, and until box1's review they had no rows at all — which is where
      # both of the defects that review found were living. (#102 review)
      - name: the two overlay-age readers, and controls that put the bugs back
        run: |
          python3 scripts/check-overlay-freshness.py
          python3 scripts/check-overlay-freshness-controls.py

      - name: card generation is stable and matches the committed overlay
        run: ./scripts/check-cards.sh

      # pipeOS#100. The resume predicate had been permanently false fleet-wide
      # and nothing said so, because the only test of it staged the one layout
      # #80 says is wrong. This runs the SHIPPED predicate against both layouts
      # and against the pre-fix control.
      - name: the resume predicate sees a transcript behind the projects symlink
        run: python3 scripts/check-cohort-watch.py

      # pipeOS#101. The defect was a correct value assigned in the wrong place,
      # so this checks the ORDERING against the shipped file as well as the
      # arithmetic — a probe that only tested the numbers would have passed
      # against the bug.
      - name: the agent run budget comes from the card, not from a hardcode
        run: python3 scripts/check-agent-timeout.py

      - name: derived files are not hand-editable without detection
        run: |
          set -eu
          tmp=$(mktemp -d)
          sh overlay/usr/local/bin/pipebox-card generate \
            --card docs/cards/box3.card --root "$tmp" \
            --templates overlay/usr/local/share/pipeos/card >/dev/null
          cp docs/cards/box3.card "$tmp/card.conf"
          sh overlay/usr/local/bin/pipebox-card verify \
            --card "$tmp/card.conf" --root "$tmp" \
            --templates overlay/usr/local/share/pipeos/card
          # a hand edit must be caught, and must exit 1 rather than 0 or 2
          echo '# hand edit' >> "$tmp/etc/pipeos/mandate.md"
          set +e
          sh overlay/usr/local/bin/pipebox-card verify \
            --card "$tmp/card.conf" --root "$tmp" \
            --templates overlay/usr/local/share/pipeos/card
          rc=$?
          set -e
          [ "$rc" = 1 ] || { echo "expected exit 1 for a hand-edited file, got $rc"; exit 1; }
          echo "hand edit detected, exit 1 as specified"

      - name: an unprovisioned box reports "cannot tell", not "fine"
        run: |
          set -eu
          tmp=$(mktemp -d)
          set +e
          sh overlay/usr/local/bin/pipebox-card verify \
            --card "$tmp/absent.conf" --root "$tmp" \
            --templates overlay/usr/local/share/pipeos/card
          rc=$?
          set -e
          [ "$rc" = 2 ] || { echo "expected exit 2 with no card, got $rc"; exit 1; }
          echo "no card reports exit 2, not a false PASS"
