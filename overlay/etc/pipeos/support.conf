# pipeos-support configuration — opt-in vendor support access.
#
# When the owner switches "Vendor support access" ON in the web UI, the box
# dials OUT to this relay with a reverse tunnel (ssh -R): the vendor reaches
# the box only through the relay, only while the toggle is on, and nothing
# listens inbound on the customer network. Empty = unconfigured; the service
# refuses to start and the dashboard says so.
#
#   SUPPORT_RELAY=tunnel@relay.pipeterminal.com  # the vendor relay (docs/support-relay.md)
#   SUPPORT_PORT=42001                        # per-box port the relay maps back
#   SUPPORT_KEY=/etc/pipeos/support_key       # this box's tunnel identity

# The vendor relay is the shipped default (docs/support-relay.md, live since
# 2026-08-31); the PORT is assigned per box at enrollment and is what the
# operator pins the box's key to on the relay. Empty port = the tunnel
# cannot start yet; the dashboard's support card says so and shows the key
# to send. Self-builders: your relay or none (docs/build-your-own.md).
SUPPORT_RELAY=tunnel@relay.pipeterminal.com
SUPPORT_PORT=
SUPPORT_KEY=/etc/pipeos/support_key
