# Public HTTPS (pipeOS#286): this Machine's address on the internet's terms —
# https://<mac>.m.pipe.online with a Let's Encrypt certificate, nothing to
# install on any device. Written by pipeos-tls-public; `pipeos tls public on|off`.
PUBLIC=on
PUBLIC_RELAY=https://pipe.online
# letsencrypt | letsencrypt_test (staging: a real flow, an untrusted cert — for drills)
PUBLIC_ACME=letsencrypt
# filled by the first registration; the full MAC under m.pipe.online
PUBLIC_NAME=
