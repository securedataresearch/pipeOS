# pipeos-selfupdate configuration.
#
# UPDATE_URL: base URL of a signed pipeos apk repo — the tree
# 30-build-apks.sh produces at out/repo/pipeos (so that <UPDATE_URL>/x86_64/
# holds APKINDEX.tar.gz and the *.apk files). The repo must be signed by a key
# this box already trusts (/etc/apk/keys); apk verifies the index itself.
#
# Empty = self-update disabled. This is the shipped default on purpose: a box
# does not pull and apply an OS update until an operator has pointed it at a
# source it trusts. Set it, then `pipeos selfupdate` runs the daily cron flow.
#
# Pilot source (2026-08-09): the BUILD box (box1) already produces this repo at
# /work/repos/pipeOS/out/repo/pipeos; serving that dir over HTTP makes it the
# fleet's update origin. Under #651 the netboot server serves it instead.
#
#   UPDATE_URL=http://192.168.254.68:8080/pipeos

UPDATE_URL=
