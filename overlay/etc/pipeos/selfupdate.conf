# pipeos-selfupdate configuration.
#
# UPDATE_RELEASE_URL (the product path): base URL of a GitHub-Release-style
# flat asset directory holding SHA256SUMS + pipeos-repo.tar.gz, published by
# `make release`. For the canonical origin, once the repo is public:
#
#   UPDATE_RELEASE_URL=https://github.com/securedataresearch/pipeOS/releases/latest/download
#
# UPDATE_URL (the pilot/fleet path): base URL of a signed pipeos apk repo —
# the tree 30-build-apks.sh produces at out/repo/pipeos (so <UPDATE_URL>/x86_64/
# holds APKINDEX.tar.gz and the *.apk files), e.g. a dev box serving its
# out/repo over busybox httpd. UPDATE_RELEASE_URL takes precedence.
#
# Both empty = self-update disabled, the shipped default: a box does not pull
# and apply an OS update until it is pointed at a source it trusts. The repo
# is signed; apk verifies every package against /etc/apk/keys regardless of
# where the bits came from. Updates apply via the verified/atomic path
# (verify-repo -> sync-media -> upgrade -> save -> pipeos verify, with
# automatic rollback), daily via cron once configured.

# The canonical origin, set by default: silent daily self-update is the
# shipped client posture (owner decision, 2026-08-30). Blank it to disable.
UPDATE_RELEASE_URL=https://github.com/securedataresearch/pipeOS/releases/latest/download
UPDATE_URL=
