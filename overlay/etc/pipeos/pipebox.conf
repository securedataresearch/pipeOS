# pipebox runtime configuration — sourced by pipebox-listener,
# pipebox-cohort-watch, pipebox-gh-notify, and pipebox-report.
# Lives in /etc so it rides the apkovl.

# The pipe nick whose requests carry final authority (see mandate.md).
# Empty = listener replies conversationally to no one and DMs go nowhere;
# fill in at sign-in time.
OWNER_NICK="sam"

# The Foreman: placed above the boxes by the owner to run issues/kanban,
# review and merge PRs, and assign work. Authorizes the same work the owner
# does, but cannot lift a hard ban or change who the principals are.
FOREMAN_NICK="shrek"

# The cohort whose board is this project's shared channel. Polled by
# pipebox-cohort-watch, because the shipped `pipe wait --only me` pump does
# not deliver board posts (pipe#555).
COHORT_ID="3"

# GitHub owner whose repos the notify cron watches.
GH_OWNER="securedataresearch"
