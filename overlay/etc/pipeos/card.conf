# pipeOS model card — the unprovisioned default that ships in the image.
#
# This is the one file on the box that is written by hand. Everything else
# about this box's identity is generated from it:
#
#   /etc/pipeos/pipebox.conf
#   /etc/pipeos/pipebox-settings.json
#   /etc/pipeos/mandate.md
#   /root/.pipe/policy.json              (since #58)
#   /etc/profile.d/10-pipebox-env.sh     (since #90)
#
# `pipebox-setup` fills this in and runs `pipebox-card generate`. Editing a
# generated file instead is detectable — `pipebox-card verify` exits 1 — and
# the edit is lost at the next generation.
#
# Empty values are legal here and mean unprovisioned: the agent takes
# direction from nobody, which is the correct posture for a box that has not
# been told who owns it.
#
# THIS IS THE PRODUCT DEFAULT — it ships in the downloadable image and is what
# an unopened box in any business boots into (#134). Two rules follow from that
# and neither is style:
#
#   NICK stays EMPTY. It is derived at setup from the identity the sign-in key
#   actually produced, not baked here. Baking it is what made the old image
#   one named customer's box and forced a bespoke build per business.
#
#   Nothing fleet-specific may appear in this file. GH_OWNER shipped carrying
#   the vendor's own GitHub org until #134 — a stranger's machine, told to
#   point its notify cron at repos belonging to whoever built the image.
#   check-cards.sh (CI) is the gate that keeps this file generic — it renders
#   this card and fails if the committed overlay diverges. (An earlier
#   revision credited a nonexistent audit-image.sh here; pipeOS#149.)

NICK=
ROLE=GENERIC
OWNER_NICK=
FOREMAN_NICK=
COHORT_ID=
GH_OWNER=
MAC=

# What this box must be able to BUILD, as comma-separated probe names
# (pipe#650 item 7). Empty = this role compiles nothing, and the toolchain
# check is skipped rather than passed.
#
# Declaring a toolchain is a claim the box has to make good on: selfcheck
# compiles a real artifact for each name, because `cargo --version` answered
# happily on three boxes whose linker was broken.
TOOLCHAIN=

# The repos this box is expected to have on disk, comma-separated
# (pipe#650 item 8). Empty = none expected. A box that posts a claim against
# a branch in a repo it has never cloned is the failure this closes.
REPOS=

# /work disk-pressure thresholds, percent-used (pipeOS#41). Empty = the
# selfcheck fallback of WARN 70 / CRIT 85. Card-declared because 53G and 25G
# boxes should not share a constant: the same percentage leaves very
# different absolute headroom, and box1 measured a single cargo incremental
# cache eating 24G in one busy day. Smaller boxes want to WARN earlier.
DISK_WARN_PCT=70
DISK_CRIT_PCT=85

# Reclamation interval, hours (pipeOS#41, Foreman ruling 2026-08-10). Empty =
# the pipeos-gc fallback of 24 (once a day). This is DETECTION's counterpart,
# not a duplicate of it: DISK_WARN_PCT/DISK_CRIT_PCT above catch a surprise
# consumer; GC_INTERVAL_HOURS drives a proactive, scheduled pass that keeps
# usage low continuously, whether or not a threshold is anywhere near firing.
# Card-declared for the same reason as the thresholds: a box that
# accumulates 12G of target/ in a day wants a shorter interval than one that
# accumulates 2.5G, regardless of how much total disk either has.
GC_INTERVAL_HOURS=

# Percent /work-full at which the weekly worksweep starts reclaiming build
# output (pipeOS#110). Empty = the sweep's own default of 60, kept below the
# disk WARN threshold on purpose: the sweep is what keeps the box off the
# warning, not a thing that runs after someone is already being paged.
WORKSWEEP_PCT=

# Days an undeployed overlay commit may sit before selfcheck escalates from
# WARN to CRITICAL (pipeOS#97). Empty = the selfcheck fallback of 3. The
# number this exists for is four: #51/#62/#63/#71 were merged 2026-08-10/11
# and ran on zero boxes until 2026-08-15, with three boxes dead the whole
# time on a bug that was already fixed. 1-90.
OVERLAY_CRIT_DAYS=
