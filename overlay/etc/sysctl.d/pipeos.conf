# pipeOS: IPv6 off. Every listener binds 0.0.0.0; a SLAAC global address was
# an unfiltered second front door (sshd, smbd). lo keeps ::1 for local-only
# software. Order matters: all= writes through to lo, so lo= comes after.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 0
